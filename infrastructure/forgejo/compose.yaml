services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11-rootless
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: "${FORGEJO_ROOT_URL:-https://forge.local/}"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
    networks:
      - server-control

volumes:
  forgejo-data:
    name: ai-workshop-forgejo-data
  forgejo-config:
    name: ai-workshop-forgejo-config

networks:
  server-control:
    external: true
    name: ai-workshop-server-control
