services:
  server-control:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    command:
      - server
      - serve
      - --config
      - /config/server.yaml
      - --state-root
      - /state
      - --host
      - 0.0.0.0
      - --port
      - "8770"
    volumes:
      - ./config/server.yaml:/config/server.yaml:ro
      - ${AI_WORKSHOP_RUNTIME_SOCKET:-/run/user/1000/docker.sock}:/run/ai-workshop-runtime/1000/docker.sock
      - ${AI_WORKSHOP_STORAGE_ROOT:-/var/lib/ai-workshop/storage}:/var/lib/ai-workshop/storage
      - server-state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [server-control]

  gateway:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    command:
      - server
      - gateway
      - --config
      - /config/server.yaml
      - --state-root
      - /state
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    volumes:
      - ./config/server.yaml:/config/server.yaml:ro
      - ${AI_WORKSHOP_STORAGE_ROOT:-/var/lib/ai-workshop/storage}:/var/lib/ai-workshop/storage
      - server-state:/state
    ports:
      - "127.0.0.1:${AI_WORKSHOP_MCP_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [server-control]

  browser:
    build:
      context: ../..
      dockerfile: browser/Dockerfile
    environment:
      AI_WORKSHOP_BROWSER_TOKEN_FILE: /run/secrets/browser_token
      AI_WORKSHOP_BROWSER_TOKEN: ${AI_WORKSHOP_BROWSER_TOKEN}
    volumes:
      - browser-profile:/data/browser-profile
      - browser-artifacts:/data/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [server-control]

  ingress:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    command:
      - server
      - serve
      - --config
      - /config/server.yaml
      - --state-root
      - /state
      - --host
      - 0.0.0.0
      - --port
      - "8443"
    depends_on:
      server-control:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/config/server.yaml:ro
      - server-state:/state
      - server-ca:/var/lib/ai-workshop/ca
    ports:
      - "${AI_WORKSHOP_HTTPS_BIND:-127.0.0.1:8443}:8443"
    restart: unless-stopped
    networks: [server-control]

volumes:
  server-state:
  server-ca:
  browser-profile:
  browser-artifacts:

networks:
  server-control:
    name: ai-workshop-server-control
