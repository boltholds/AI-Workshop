# Opt-in worker overlay; never mount WAI state, host Docker socket or credentials.
# Set AI_WORKSHOP_ANALYSIS_TOKEN to a fresh random secret in deploy/server/.env.
services:
  gateway:
    environment:
      AI_WORKSHOP_ENABLE_PROJECT_FILES: "1"
      AI_WORKSHOP_ANALYSIS_URL: http://analysis-worker:8795
      AI_WORKSHOP_ANALYSIS_TOKEN: ${AI_WORKSHOP_ANALYSIS_TOKEN:?analysis worker token required}
    networks:
      - server-control
      - analysis-private
  analysis-worker:
    build:
      context: ../..
      dockerfile: analysis/Dockerfile
    environment:
      AI_WORKSHOP_ANALYSIS_TOKEN: ${AI_WORKSHOP_ANALYSIS_TOKEN:?analysis worker token required}
      AI_WORKSHOP_PROJECTS_ROOT: /workspace/projects
      AI_WORKSHOP_ANALYSIS_RESULTS: /analysis
      AI_WORKSHOP_CARGO_CACHE_ROOT: /cargo-cache
      AI_WORKSHOP_CARGO_LOCKS_ROOT: /cargo-lockfiles
      AI_WORKSHOP_CARGO_SCRATCH_ROOT: /cargo-build
    volumes:
      - ${AI_WORKSHOP_STORAGE_ROOT:-/var/lib/ai-workshop/storage}/projects:/workspace/projects:ro
      - analysis-results:/analysis
      - cargo-cache:/cargo-cache:ro
      - cargo-lockfiles:/cargo-lockfiles:ro
      - ${AI_WORKSHOP_GHIDRA_ROOT:-/opt/ai-workshop/ghidra}:/opt/ghidra:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=2g
      - /cargo-build:rw,exec,nosuid,mode=1777,size=2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 6g
    cpus: 2
    restart: unless-stopped
    networks:
      - analysis-private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8795/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  cargo-prefetch:
    profiles: ["cargo"]
    build:
      context: ../..
      dockerfile: analysis/cargo-prefetch.Dockerfile
    volumes:
      - ${AI_WORKSHOP_STORAGE_ROOT:-/var/lib/ai-workshop/storage}/projects:/workspace/projects:ro
      - cargo-cache:/cargo-cache
      - cargo-lockfiles:/cargo-lockfiles
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 3g
    cpus: 2
    networks:
      - cargo-egress

volumes:
  analysis-results:
  cargo-cache:
  cargo-lockfiles:

networks:
  analysis-private:
    internal: true
  cargo-egress:
    internal: false
