[project]
name = "ai-workshop"
version = "0.1.0"
description = "Isolated local development environment for AI agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "pillow>=11,<13"]
dev = ["pytest>=8,<10"]

[project.scripts]
ai-workshop = "ai_workshop.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
