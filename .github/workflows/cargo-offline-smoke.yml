name: Offline Cargo smoke

on:
  pull_request:
    paths:
      - "src/ai_workshop/analysis/**"
      - "src/ai_workshop/gateway/cargo_prefetch_client.py"
      - "src/ai_workshop/gateway/project_workspace_tools.py"
      - "src/ai_workshop/gateway/server.py"
      - "src/ai_workshop/server/gateway.py"
      - "tests/unit/analysis/test_cargo_prefetch_api.py"
      - "analysis/**"
      - "deploy/server/compose.analysis.yaml"
      - ".github/workflows/cargo-offline-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/ai_workshop/analysis/**"
      - "src/ai_workshop/gateway/cargo_prefetch_client.py"
      - "src/ai_workshop/gateway/project_workspace_tools.py"
      - "src/ai_workshop/gateway/server.py"
      - "src/ai_workshop/server/gateway.py"
      - "tests/unit/analysis/test_cargo_prefetch_api.py"
      - "analysis/**"
      - "deploy/server/compose.analysis.yaml"
      - ".github/workflows/cargo-offline-smoke.yml"

jobs:
  cargo-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both isolated Cargo images
        run: |
          docker build -f analysis/cargo-prefetch.Dockerfile -t wai-prefetch:ci .
          docker build -f analysis/Dockerfile -t wai-worker:ci .
      - name: Make a real Rust crate requiring earcutr
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wai-cargo-projects/demo/src"
          cat > "$RUNNER_TEMP/wai-cargo-projects/demo/Cargo.toml" <<'EOF'
          [package]
          name = "wai-cargo-smoke"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          earcutr = "0.5.0"
          EOF
          cat > "$RUNNER_TEMP/wai-cargo-projects/demo/src/lib.rs" <<'EOF'
          pub fn triangle() -> u32 { 3 }
          #[cfg(test)]
          mod tests {
              #[test]
              fn triangle() { assert_eq!(super::triangle(), 3); }
          }
          EOF
          docker volume create "wai-cargo-cache-$GITHUB_RUN_ID"
          docker volume create "wai-cargo-locks-$GITHUB_RUN_ID"
      - name: Exercise authenticated Cargo prefetch API (no Docker socket in sidecar)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name "wai-prefetch-api-$GITHUB_RUN_ID" \
            --network bridge --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 10001:10001 \
            --tmpfs /tmp:rw,nosuid,size=1g \
            --env AI_WORKSHOP_CARGO_PREFETCH_TOKEN=ci-test-token-000000000000000000 \
            --mount "type=bind,source=$RUNNER_TEMP/wai-cargo-projects,target=/workspace/projects,readonly" \
            --mount "type=volume,source=wai-cargo-cache-$GITHUB_RUN_ID,target=/cargo-cache" \
            --mount "type=volume,source=wai-cargo-locks-$GITHUB_RUN_ID,target=/cargo-lockfiles" \
            --entrypoint python wai-prefetch:ci \
            -m uvicorn ai_workshop.analysis.cargo_prefetch_app:load_app \
            --factory --host 127.0.0.1 --port 8796
          docker exec -i "wai-prefetch-api-$GITHUB_RUN_ID" python - <<'PY'
          import json, time, urllib.error, urllib.request
          url = "http://127.0.0.1:8796/v1/cargo/prefetch"
          for attempt in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8796/health", timeout=1)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("Prefetch API never became healthy")
          body = json.dumps({"project_id": "demo", "manifest_path": "Cargo.toml"}).encode()
          try:
              urllib.request.urlopen(urllib.request.Request(url, data=body, method="POST",
                  headers={"Content-Type": "application/json"}), timeout=5)
              raise AssertionError("No-token cargo prefetch must fail")
          except urllib.error.HTTPError as error:
              assert error.code == 401
          req = urllib.request.Request(url, data=body, method="POST",
              headers={"Authorization": "Bearer ci-test-token-000000000000000000",
                       "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=300) as response:
              result = json.load(response)
          assert result["prepared"] and result["project_id"] == "demo", result
          assert len(result["dependency_fingerprint"]) == 64, result
          print("networked cargo prefetch API prepared the offline cache")
          PY
          test ! -e "$RUNNER_TEMP/wai-cargo-projects/demo/Cargo.lock"

      - name: Prefetch crates with network access and a read-only checkout
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network bridge --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 10001:10001 \
            --tmpfs /tmp:rw,nosuid,size=1g \
            --mount "type=bind,source=$RUNNER_TEMP/wai-cargo-projects,target=/workspace/projects,readonly" \
            --mount "type=volume,source=wai-cargo-cache-$GITHUB_RUN_ID,target=/cargo-cache" \
            --mount "type=volume,source=wai-cargo-locks-$GITHUB_RUN_ID,target=/cargo-lockfiles" \
            wai-prefetch:ci demo
          test ! -e "$RUNNER_TEMP/wai-cargo-projects/demo/Cargo.lock"
      - name: Run Cargo tests offline with an immutable shared cache
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 10001:10001 \
            --tmpfs /tmp:rw,nosuid,size=2g \
            --tmpfs /cargo-build:rw,exec,nosuid,mode=1777,size=2g --memory 4g \
            -e AI_WORKSHOP_CARGO_SCRATCH_ROOT=/cargo-build \
            --mount "type=bind,source=$RUNNER_TEMP/wai-cargo-projects,target=/workspace/projects,readonly" \
            --mount "type=volume,source=wai-cargo-cache-$GITHUB_RUN_ID,target=/cargo-cache,readonly" \
            --mount "type=volume,source=wai-cargo-locks-$GITHUB_RUN_ID,target=/cargo-lockfiles,readonly" \
            --entrypoint python wai-worker:ci -c '
          from pathlib import Path
          from ai_workshop.analysis.engine import AnalysisEngine
          Path("/tmp/results").mkdir()
          engine = AnalysisEngine(projects_root=Path("/workspace/projects"), results_root=Path("/tmp/results"))
          result = engine.cargo_test("demo", timeout_seconds=240)
          print(result["stdout"])
          raise SystemExit(result["exit_code"])
          '
          test ! -e "$RUNNER_TEMP/wai-cargo-projects/demo/Cargo.lock"
      - name: Remove temporary CI volumes
        if: always()
        run: |
          docker rm -f "wai-prefetch-api-$GITHUB_RUN_ID" || true
          docker volume rm -f "wai-cargo-cache-$GITHUB_RUN_ID" || true
          docker volume rm -f "wai-cargo-locks-$GITHUB_RUN_ID" || true
