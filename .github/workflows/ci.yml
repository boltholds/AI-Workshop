name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync
      - name: Test
        run: uv run pytest tests/unit tests/integration --ignore=tests/integration/browser -v

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      AI_WORKSHOP_WORKSPACE_TOKEN: ci-workspace-token-for-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install host CLI
        run: uv sync
      - name: Configure fixture project
        run: |
          echo "AI_WORKSHOP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "AI_WORKSHOP_GID=$(id -g)" >> "$GITHUB_ENV"
          cat > config/projects.local.yaml <<YAML
          projects:
            fixture:
              host: "$GITHUB_WORKSPACE/tests/fixtures/host-project"
              container: /workspace/fixture
              mode: rw
          YAML
          uv run ai-workshop compose render \
            --projects config/projects.local.yaml \
            --output .workshop/compose.projects.yaml
      - name: Build and start workspace
        run: |
          docker compose -f compose.yaml -f .workshop/compose.projects.yaml up -d --build agent-workspace
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/health; then
              break
            fi
            sleep 2
          done
          test "$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' http://127.0.0.1:8766/v1/projects)" = "401"
          docker compose -f compose.yaml -f .workshop/compose.projects.yaml exec -T agent-workspace bash -lc '
            python --version &&
            node --version &&
            npm --version &&
            pnpm --version &&
            uv --version &&
            poetry --version &&
            pytest --version &&
            rg --version &&
            fd --version &&
            jq --version &&
            curl --version &&
            wget --version
          '
      - name: MCP end-to-end smoke
        run: |
          uv run ai-workshop gateway --workspace-url http://127.0.0.1:8766 > /tmp/ai-workshop-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill $GATEWAY_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 1 --max-time 2 -X POST http://127.0.0.1:8765/mcp || true)"
            if [ "$CODE" != "000" ]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/ai-workshop-gateway.log
            exit 1
          fi
          uv run python tests/e2e/mcp_smoke.py
      - name: Stop workspace
        if: always()
        run: docker compose -f compose.yaml -f .workshop/compose.projects.yaml down -v


  browser-diagnostics:
    runs-on: ubuntu-latest
    env:
      AI_WORKSHOP_WORKSPACE_TOKEN: ci-workspace-token-for-tests-only
      AI_WORKSHOP_BROWSER_TOKEN: ci-browser-token-for-tests-only
    steps:
      - uses: actions/checkout@v4
      - name: Build browser image
        run: docker compose build browser
      - name: Browser runtime and temporal composite tests
        run: |
          docker compose run --rm --no-deps \
            -v "$GITHUB_WORKSPACE:/work" \
            --entrypoint bash browser -lc '
              python -m venv /tmp/browser-test &&
              /tmp/browser-test/bin/pip install -q -e /work pytest &&
              cd /work &&
              /tmp/browser-test/bin/pytest tests/integration/browser tests/e2e/test_browser_diagnostics.py -v
            '
      - name: Browser service auth smoke
        run: |
          docker compose up -d browser
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8767/health; then
              break
            fi
            sleep 2
          done
          test "$(curl --silent --output /tmp/browser-unauth.json --write-out '%{http_code}' http://127.0.0.1:8767/v1/console)" = "401"
          curl --fail --silent \
            -H "Authorization: Bearer $AI_WORKSHOP_BROWSER_TOKEN" \
            http://127.0.0.1:8767/v1/console
      - name: Stop browser
        if: always()
        run: docker compose down -v
