name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync
      - name: Test
        run: uv run pytest tests/unit tests/integration --ignore=tests/integration/browser -v

  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync
      - name: Browser tests
        run: uv run pytest tests/unit/browser tests/integration/browser tests/e2e/test_browser_diagnostics.py -v

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install host CLI
        run: uv sync
      - name: Configure fixture project
        run: |
          cat > config/projects.local.yaml <<YAML
          projects:
            fixture:
              host: "$GITHUB_WORKSPACE/tests/fixtures/host-project"
              container: /workspace/fixture
              mode: rw
          YAML
          uv run ai-workshop compose render --projects config/projects.local.yaml --output .workshop/compose.projects.yaml
      - name: Build and start core services
        run: |
          docker compose -f compose.yaml -f .workshop/compose.projects.yaml up -d --build agent-workspace browser
          for port in 8766 8767; do
            ok=0
            for i in $(seq 1 45); do
              if curl --fail --silent "http://127.0.0.1:${port}/health"; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              docker compose -f compose.yaml -f .workshop/compose.projects.yaml logs
              exit 1
            fi
          done
      - name: Stop services
        if: always()
        run: docker compose -f compose.yaml -f .workshop/compose.projects.yaml down -v
