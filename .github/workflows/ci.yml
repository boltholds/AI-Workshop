name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync
      - name: Test
        run: uv run pytest tests/unit tests/integration --ignore=tests/integration/browser -v
      - name: Validate bootstrap script syntax
        shell: bash
        run: |
          bash -n scripts/bootstrap.sh scripts/tunnel.sh
          pwsh -NoProfile -Command '$files=@("scripts/bootstrap.ps1","scripts/tunnel.ps1"); foreach($file in $files){$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count -gt 0){$errors | Format-List | Out-String | Write-Error; exit 1}}'

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      AI_WORKSHOP_WORKSPACE_TOKEN: ci-workspace-token-for-tests-only
      AI_WORKSHOP_BROWSER_TOKEN: ci-browser-token-for-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install host CLI
        run: uv sync
      - name: Configure fixture project
        run: |
          echo "AI_WORKSHOP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "AI_WORKSHOP_GID=$(id -g)" >> "$GITHUB_ENV"
          cat > config/projects.local.yaml <<YAML
          projects:
            fixture:
              host: "$GITHUB_WORKSPACE/tests/fixtures/host-project"
              container: /workspace/fixture
              mode: rw
          YAML
          uv run ai-workshop compose render \
            --projects config/projects.local.yaml \
            --output .workshop/compose.projects.yaml
      - name: Build and start workspace
        run: |
          docker compose -f compose.yaml -f .workshop/compose.projects.yaml up -d --build agent-workspace
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/health; then
              break
            fi
            sleep 2
          done
          test "$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' http://127.0.0.1:8766/v1/projects)" = "401"
          docker compose -f compose.yaml -f .workshop/compose.projects.yaml exec -T agent-workspace bash -lc '
            python --version &&
            node --version &&
            npm --version &&
            pnpm --version &&
            uv --version &&
            poetry --version &&
            pytest --version &&
            rg --version &&
            fd --version &&
            jq --version &&
            curl --version &&
            wget --version
          '
      - name: MCP end-to-end smoke
        run: |
          uv run ai-workshop gateway --workspace-url http://127.0.0.1:8766 > /tmp/ai-workshop-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill $GATEWAY_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 1 --max-time 2 -X POST http://127.0.0.1:8765/mcp || true)"
            if [ "$CODE" != "000" ]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/ai-workshop-gateway.log
            exit 1
          fi
          uv run python tests/e2e/mcp_smoke.py
      - name: Generic local infrastructure E2E
        run: uv run pytest tests/e2e/test_local_infrastructure.py -v
      - name: Stop workspace
        if: always()
        run: docker compose -f compose.yaml -f .workshop/compose.projects.yaml down -v


  browser-diagnostics:
    runs-on: ubuntu-latest
    env:
      AI_WORKSHOP_WORKSPACE_TOKEN: ci-workspace-token-for-tests-only
      AI_WORKSHOP_BROWSER_TOKEN: ci-browser-token-for-tests-only
    steps:
      - uses: actions/checkout@v4
      - name: Build browser image
        run: docker compose build browser
      - name: Browser runtime and temporal composite tests
        run: |
          docker compose run --rm --no-deps \
            -v "$GITHUB_WORKSPACE:/work" \
            --entrypoint bash browser -lc '
              python -m pip install --user -q pytest &&
              cd /work &&
              python -m pytest tests/integration/browser tests/e2e/test_browser_diagnostics.py -v
            '
      - name: Browser service auth smoke
        run: |
          docker compose up -d browser
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8767/health; then
              break
            fi
            sleep 2
          done
          test "$(curl --silent --output /tmp/browser-unauth.json --write-out '%{http_code}' http://127.0.0.1:8767/v1/console)" = "401"
          curl --fail --silent \
            -H "Authorization: Bearer $AI_WORKSHOP_BROWSER_TOKEN" \
            http://127.0.0.1:8767/v1/console
      - name: Stop browser
        if: always()
        run: docker compose down -v

  full-workshop-e2e:
    runs-on: ubuntu-latest
    env:
      AI_WORKSHOP_WORKSPACE_TOKEN: ci-workspace-token-for-tests-only
      AI_WORKSHOP_BROWSER_TOKEN: ci-browser-token-for-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install host CLI
        run: uv sync
      - name: Initialize isolated sample project
        run: |
          git -C tests/fixtures/sample_project init
          git -C tests/fixtures/sample_project config user.email test@example.com
          git -C tests/fixtures/sample_project config user.name "AI Workshop E2E"
          git -C tests/fixtures/sample_project add .
          git -C tests/fixtures/sample_project commit -m initial
          printf '%s\n' protected-outside-workspace > tests/fixtures/outside-protected.txt
          echo "AI_WORKSHOP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "AI_WORKSHOP_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Render project and service profiles
        run: |
          cat > config/projects.local.yaml <<YAML
          projects:
            sample:
              host: "$GITHUB_WORKSPACE/tests/fixtures/sample_project"
              container: /workspace/sample
              mode: rw
          YAML
          uv run ai-workshop compose render \
            --projects config/projects.local.yaml \
            --output .workshop/compose.projects.yaml
          uv run ai-workshop services render \
            --projects config/projects.local.yaml \
            --services tests/fixtures/full-workshop-services.yaml \
            --compose-output .workshop/compose.services.yaml \
            --registry-output .workshop/service-registry.yaml
      - name: Start Workshop runtime
        run: |
          docker compose -f compose.yaml -f .workshop/compose.projects.yaml up -d --build agent-workspace browser
          for url in http://127.0.0.1:8766/health http://127.0.0.1:8767/health; do
            ready=0
            for i in $(seq 1 60); do
              if curl --fail --silent "$url" >/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" = "1"
          done
      - name: Full MCP workflow
        run: |
          uv run ai-workshop gateway \
            --workspace-url http://127.0.0.1:8766 \
            --browser-url http://127.0.0.1:8767 \
            --browser-token "$AI_WORKSHOP_BROWSER_TOKEN" \
            --service-registry .workshop/service-registry.yaml \
            > /tmp/ai-workshop-full-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill $GATEWAY_PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 1 --max-time 2 -X POST http://127.0.0.1:8765/mcp || true)"
            if [ "$code" != "000" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/ai-workshop-full-gateway.log
            exit 1
          fi
          uv run ai-workshop doctor \
            --projects config/projects.local.yaml \
            --workspace-url http://127.0.0.1:8766 \
            --browser-url http://127.0.0.1:8767
          AI_WORKSHOP_E2E_PROJECT="$GITHUB_WORKSPACE/tests/fixtures/sample_project" \
          AI_WORKSHOP_E2E_OUTSIDE="$GITHUB_WORKSPACE/tests/fixtures/outside-protected.txt" \
            uv run pytest tests/e2e/test_full_workshop.py -v
      - name: Stop full Workshop
        if: always()
        run: |
          docker compose -p ai-workshop-services -f .workshop/compose.services.yaml down -v || true
          docker compose -f compose.yaml -f .workshop/compose.projects.yaml down -v || true



  server-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start autonomous Server Mode runtime
        run: |
          docker compose -f compose.server.yaml up -d --build
          ready=0
          for i in $(seq 1 80); do
            if docker compose -f compose.server.yaml exec -T server-control \
                ai-workshop server doctor \
                --config /config/server.yaml \
                --state-root /state >/tmp/server-doctor.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker compose -f compose.server.yaml ps
            docker compose -f compose.server.yaml logs
            exit 1
          fi
          cat /tmp/server-doctor.json
      - name: Create nested workload and persistent state
        run: |
          docker compose -f compose.server.yaml exec -T server-control \
            python - phase-one < tests/e2e/test_server_runtime.py
      - name: Restart only outer control plane
        run: |
          docker compose -f compose.server.yaml restart server-control
          ready=0
          for i in $(seq 1 40); do
            if docker compose -f compose.server.yaml exec -T server-control \
                ai-workshop server doctor \
                --config /config/server.yaml \
                --state-root /state >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
      - name: Verify runtime and storage survived control-plane restart
        run: |
          docker compose -f compose.server.yaml exec -T server-control \
            python - phase-two < tests/e2e/test_server_runtime.py
      - name: Stop autonomous Server Mode runtime
        if: always()
        run: docker compose -f compose.server.yaml down -v
